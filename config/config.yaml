# The directory containing the plate data
pathvars:
  plate_data: '/Users/owenburroughs/Desktop/Personal_Skaar_Lab/EPS007_Code/Test_Dataset'
  databases: '/Users/owenburroughs/Desktop/Personal_Skaar_Lab/EPS007_Code/BacilliScope/results/databases'

# The channel indicies for this experiment
channels:
  cellmask: 1
  constitutive: 2
  reporter: 3

# Parameters to use for cellpose
cellpose:
  diameter: 40
  resample: False
  batch_size: 16
  min_size: 100
  verbose: True
  socket_path: '/tmp/cellpose_server.sock'

# The proportion of images to sample for Otsu thresholds
sample_proportion: 0.1

# The wells used for different controls
